name: vinhuni_app
description: "Hệ thống quản và hỗ trợ đào tạo cho cán bộ và người học -Trường Đại học Vinh."
publish_to: 'none'

# TĂNG LÊN +3 VÌ BẠN ĐÃ CÓ BẢN +2 TRƯỚC ĐÓ
version: 1.3.5+21

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  record: 5.1.0
  #path_provider: ^2.1.2
  
  # 1. 🔥 Hạ xuống bản ^12.0.0 để khớp với các plugin khác
  geolocator: ^12.0.0 
  speech_to_text: ^7.3.0  
  web_socket_channel: ^2.4.0

  cached_network_image: ^3.3.1
  webview_flutter: ^4.10.0
  dio: ^5.9.2
  path_provider: ^2.1.2
  path: ^1.8.3
  http: ^1.1.0
  intl: ^0.18.1
  share_plus: ^7.2.1
  syncfusion_flutter_pdfviewer: ^27.2.5
  flutter_speed_dial: ^7.0.0
  receive_sharing_intent: ^1.6.3 
  cupertino_icons: ^1.0.6
  flutter_widget_from_html_core: ^0.10.0
  flutter_markdown: ^0.6.14
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.2
  local_auth_android: ^1.0.39
  local_auth_ios: ^1.1.7

  # 2. 🔥 BỘ ĐÔI FIREBASE ỔN ĐỊNH (Tương đương iOS SDK 11.0)
  # Đã hạ xuống bản 2.27.0 và 14.7.10 để không bị lỗi build
  firebase_core: 2.27.0
  firebase_messaging: 14.7.10
  #cloud_firestore: ^4.15.8

  flutter_local_notifications: ^17.2.3 
  device_info_plus: ^10.1.2
  app_links: ^7.0.0
  camera: ^0.11.0
  image_picker: ^1.0.7
  local_auth: ^2.3.0
  flutter_inappwebview: ^6.0.0
  flutter_app_badger: ^1.5.0
  permission_handler: ^12.0.1
  qr_code_scanner_plus: ^2.1.0
  qr_flutter: ^4.1.0 # Thư viện vẽ mã QR siêu nhẹ
  flutter_html: ^3.0.0
  flutter_secure_storage: ^9.0.0
  socket_io_client: ^3.1.4
  any_link_preview: ^3.0.1
  file_picker: ^8.1.4
  youtube_player_flutter: ^9.1.3
  
  # Hai goi duoi day dang duoc import truc tiep trong lib/ nhung truoc
  # day chi co mat gian tiep qua goi khac - neu goi kia bo chung thi
  # ban dung se vo. Khai bao tuong minh, khoa theo phien ban dang chay.
  flutter_cache_manager: ^3.4.1
  package_info_plus: ^8.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  record_platform_interface: 1.1.0 

  # BỔ SUNG ĐỂ TỰ ĐỘNG TẠO APP ICON
  flutter_launcher_icons: ^0.13.1

# CẤU HÌNH TẠO ICON TỰ ĐỘNG
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true # Bắt buộc cho App Store

flutter:
  uses-material-design: true

  # Cấu hình tài nguyên hình ảnh
  assets:
    - assets/images/
    - assets/images/logo.png